name: sidecar

# The devices sidecar's image (sidecar/Containerfile), published for the installer to pull:
# ghcr.io/einhq/devices:main is main as of the last build, :sha-<commit> each commit built,
# :<version> the newest build of the sidecar's VERSION (sidecar/discovery.ts) and :<line> the newest
# of its compatible line (0.1 for 0.1.x, 1 for 1.x), which the installer pulls for the range the
# module asks for. The label eu.einhq.api says the VERSION too. Built when a push to main changes
# sidecar/, and at once when run by hand.
on:
  push:
    branches: [main]
    paths: ['sidecar/**', '.github/workflows/sidecar.yml']
  workflow_dispatch:

concurrency:
  group: sidecar
  cancel-in-progress: false

jobs:
  image:
    # GitHub alone publishes: a Forgejo that runs this repository's workflows has no use for it.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - id: sha
        run: |
          echo "sha=$(git rev-parse --short=9 HEAD)" >>"$GITHUB_OUTPUT"
          version=$(sed -n "s/^export const VERSION = '\([0-9]*\.[0-9]*\.[0-9]*\)';$/\1/p" sidecar/discovery.ts)
          [ -n "$version" ] || { echo "no VERSION in sidecar/discovery.ts"; exit 1; }
          major=${version%%.*} minor=${version#*.}
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "line=$([ "$major" = 0 ] && echo "0.${minor%%.*}" || echo "$major")" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: sidecar
          file: sidecar/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/devices:main
            ghcr.io/${{ github.repository_owner }}/devices:sha-${{ steps.sha.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/devices:${{ steps.sha.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/devices:${{ steps.sha.outputs.line }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            eu.einhq.api=${{ steps.sha.outputs.version }}
            org.opencontainers.image.description=The Devices module's sidecar for EiN: an MQTT broker, a listener for devices on the network and a restreamer for cameras, run by compose from ein/deploy
